<!DOCTYPE html>
<html>
<head>
<title>Shopping Cart</title>

<style>
body{
font-family:Arial;
background:#fff0f6;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#ff6ea8;
}

.item{
display:flex;
justify-content:space-between;
margin:10px 0;
}

button{
background:#ff8fb3;
border:none;
padding:10px;
color:white;
border-radius:8px;
width:100%;
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🛒 Your Cart</h1>

<div id="cartItems"></div>

<a href="payment.html">
<button>Checkout 💳</button>
</a>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container=document.getElementById("cartItems");

if(cart.length===0){
container.innerHTML="<p>No items yet</p>";
}else{
cart.forEach(item=>{
container.innerHTML+=`
<div class="item">
<span>${item}</span>
</div>`;
});
}
</script>

</body>
</html>
